<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7A2FA6" />
    <meta name="description" content="Find LGBTQ+ resources, events and affirming businesses across Utah." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Every picture in the directory is hosted somewhere else, so the first
         paint is gated on a DNS lookup and a TLS handshake to an origin the
         browser has never met. Warming the two the splash page needs — the old
         Glide bucket holds the logo and most splash artwork, Supabase serves
         the data and the newer uploads — overlaps that with booting the app.
         `crossorigin` because an <img> for another origin is a no-cors
         request; without it the warmed socket is the wrong kind and goes
         unused. The remaining two hosts only appear once a reader opens a
         list, so they get the cheaper DNS-only hint. -->
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="https://hosting.photobucket.com" />
    <link rel="dns-prefetch" href="https://uploads-ssl.webflow.com" />
    <title>LGBTQ.UT</title>
    <!-- Link previews (iMessage, Slack, Bluesky, Facebook…). Crawlers do not
         run the app, so these must be absolute URLs in the static HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LGBTQ.UT" />
    <meta property="og:title" content="LGBTQ.UT" />
    <meta property="og:description" content="Find LGBTQ+ resources, events and affirming businesses across Utah." />
    <meta property="og:url" content="https://lgbtqut.app/" />
    <meta property="og:image" content="https://lgbtqut.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LGBTQ.UT — Hope. Support. Belonging." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LGBTQ.UT" />
    <meta name="twitter:description" content="Find LGBTQ+ resources, events and affirming businesses across Utah." />
    <meta name="twitter:image" content="https://lgbtqut.app/og-image.jpg" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
